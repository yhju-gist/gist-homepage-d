# GIST 홈페이지 — 보안 머리말(nginx). server { } 안에 넣는다. (2026-11-17 TF 시험판)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
# https 로 운영할 때만(먼저 짧게 시험 후 늘릴 것)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
location ~* \.html$ { add_header Cache-Control "no-cache" always; }
# Cross-Origin-Embedder-Policy 는 켜지 않음 — 2026-11-17 크롬 시험: credentialless 로 켜면 유튜브 영상 틀이 막힘(끄면 재생)
